<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan Transit Pulse</title>
<meta name="description" content="Every modelled bus, BRT and metro run across a full day in Pakistan's cities. Pick a city, scrub the clock and watch it move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d0c; --ink: #f1f3f2; --dim: #98a29d; --panel: rgba(12, 15, 14, 0.84);
    --line: rgba(255, 255, 255, 0.12); --accent: #22D07A; --accent2: #0E7A47; --foot: 58px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  body.ur .t { font-family: "Noto Nastaliq Urdu", Inter, serif; }
  #map { position: absolute; inset: 0 0 var(--foot) 0; }
  #fx { position: absolute; left: 0; top: 0; pointer-events: none; }

  /* minimal map styles (replaces the MapLibre stylesheet) */
  .maplibregl-map { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .maplibregl-canvas { position: absolute; left: 0; top: 0; }
  .maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
  .maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
  .maplibregl-marker { position: absolute; left: 0; top: 0; will-change: transform; }

  /* ---------- header */
  #head { position: absolute; top: 16px; left: 16px; pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,0.95); max-width: min(520px, calc(100% - 32px)); z-index: 3; }
  #head h1 { margin: 0; font-size: clamp(26px, 4vw, 44px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  #head h1 .flag { color: var(--accent); }
  body.ur #head h1, body.ur #head .sub { font-family: "Noto Nastaliq Urdu", Inter, serif; line-height: 1.9; }
  #head .sub { margin-top: 4px; font-size: clamp(13px, 1.5vw, 16px); color: var(--dim); }
  #clock { margin-top: 8px; font-size: clamp(30px, 4vw, 44px); font-weight: 500; font-variant-numeric: tabular-nums; }
  #clock small { font-size: 14px; color: var(--dim); font-weight: 400; margin-left: 6px; }
  #count { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #count b { color: var(--accent); font-weight: 600; }
  .row-btns { display: flex; gap: 6px; margin-top: 12px; pointer-events: auto; flex-wrap: wrap; }
  #search { position: relative; pointer-events: auto; margin-top: 12px; width: min(300px, 100%); text-shadow: none; }
  input[type=search], input[type=text], input[type=password] { width: 100%; font: inherit; font-size: 14px; color: var(--ink);
    background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; }
  #q { background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 15px; }
  input:focus { outline: none; border-color: var(--accent); }
  #hits { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: #121514;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; z-index: 6; max-height: 50vh; overflow-y: auto; }
  #hits div { padding: 9px 12px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  #hits div span { color: var(--dim); font-size: 12px; }
  #hits div:hover, #hits div.sel { background: rgba(255,255,255,0.08); }

  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 11px; cursor: pointer; text-shadow: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  button:hover { border-color: rgba(255,255,255,0.35); }
  button.on { background: rgba(34,208,122,0.18); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button .k { color: var(--dim); font-size: 11px; margin-left: 4px; }
  button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }

  /* ---------- player */
  #ctl { position: absolute; left: 16px; right: 16px; bottom: calc(var(--foot) + 12px); display: flex; flex-direction: column;
    gap: 8px; pointer-events: none; align-items: flex-start; z-index: 3; }
  .bar { pointer-events: auto; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; width: 100%; max-width: 780px; }
  .bar .top { display: flex; align-items: center; gap: 12px; }
  #play { width: 44px; height: 38px; padding: 0; font-size: 16px; flex: none; background: transparent; }
  #slider { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
  .speeds { display: flex; gap: 4px; flex: none; }
  .speeds button { padding: 6px 8px; font-size: 12px; background: transparent; }
  #chart { display: block; width: 100%; height: 54px; margin-top: 6px; cursor: pointer; }
  #note { pointer-events: auto; font-size: 12px; color: var(--dim); line-height: 1.45;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .linkish { color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; font-size: inherit; backdrop-filter: none; }

  /* ---------- legend (live counts) */
  #legend { position: absolute; right: 16px; top: 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; font-size: 13px; min-width: 200px; z-index: 3;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #legend .title { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; display: flex; justify-content: space-between; }
  #legend label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 3px 0; user-select: none; }
  #legend label.off { opacity: 0.35; }
  #legend i, .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 7px currentColor; flex: none; }
  #legend .n { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; font-size: 12px; padding-left: 12px; }

  /* ---------- side panel (filters / map / display) */
  #panel { position: absolute; right: 16px; top: 16px; width: 340px; max-height: calc(100% - var(--foot) - 32px);
    display: flex; flex-direction: column; z-index: 8; background: rgba(12,15,14,0.94); border: 1px solid var(--line);
    border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  #panel .tabs { display: flex; gap: 4px; padding: 10px 10px 0; align-items: center; }
  #panel .tabs button { flex: 1; background: transparent; }
  #panel .tabs .x { flex: none; border: 0; color: var(--dim); }
  #panel .body { overflow-y: auto; padding: 4px 14px 14px; }
  #panel h4 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; }
  #panel h4 .linkish { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; font-size: 12px; border-radius: 99px; background: transparent; }
  .chip.off { opacity: 0.4; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 6px 4px; font-size: 12px; backdrop-filter: none; }
  .seg button.on { background: rgba(34,208,122,0.2); }
  .list { max-height: 210px; overflow-y: auto; border: 1px solid var(--line); border-radius: 9px; }
  .list label { display: flex; gap: 8px; align-items: center; padding: 6px 9px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .list label:hover { background: rgba(255,255,255,0.05); }
  .list label .n { margin-left: auto; color: var(--dim); font-size: 11px; white-space: nowrap; }
  .list label .rid { font-weight: 600; min-width: 50px; flex: none; padding-right: 6px; }
  .list label .nm { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list input { accent-color: var(--accent); }
  .muted { color: var(--dim); font-size: 12px; line-height: 1.5; }
  .bm { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .bm button { text-align: left; padding: 8px 10px; background: transparent; }
  .bm button small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  .bm .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(255,255,255,0.2); }
  #bmMsg { margin-top: 8px; }
  #bmMsg.err { color: #ff9b8a; }
  .row { display: flex; gap: 8px; align-items: center; }
  .switch { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13px; cursor: pointer; }
  .switch input { accent-color: var(--accent); width: 16px; height: 16px; }
  input[type=range] { accent-color: var(--accent); }

  /* ---------- vehicle card */
  #card { position: absolute; right: 16px; bottom: calc(var(--foot) + 12px); width: min(340px, calc(100% - 32px)); z-index: 5;
    background: rgba(12,15,14,0.94); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #card .rid { font-size: 22px; font-weight: 700; }
  #card .nm { font-size: 14px; margin: 2px 0 4px; }
  #card .ur-nm { font-family: "Noto Nastaliq Urdu", serif; direction: rtl; color: var(--dim); font-size: 14px; line-height: 2; }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 10px; }
  #card dt { color: var(--dim); } #card dd { margin: 0; }
  #card .x { position: absolute; top: 8px; right: 8px; border: 0; background: none; color: var(--dim); }
  #card .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); }
  .badge.pub { color: var(--accent); border-color: var(--accent2); }
  .badge.ass { color: #E9B949; border-color: #6b5520; }

  /* ---------- landing markers */
  .city { display: flex; align-items: center; gap: 8px; cursor: pointer; transform: translateX(7px); }
  .city .pin { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); flex: none;
    box-shadow: 0 0 0 4px rgba(34,208,122,0.2), 0 0 18px rgba(34,208,122,0.8); animation: pulse 2.4s ease-in-out infinite; }
  .city .lbl { font-size: 14px; font-weight: 500; color: var(--ink); white-space: nowrap; text-shadow: 0 1px 6px #000, 0 0 2px #000; }
  .city .lbl span { display: block; font-size: 11px; color: var(--dim); font-weight: 400; }
  body.ur .city .lbl { font-family: "Noto Nastaliq Urdu", serif; }
  .city:hover .pin { background: #fff; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(34,208,122,0.05), 0 0 26px rgba(34,208,122,0.9); } }

  /* ---------- footer */
  #foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot); z-index: 9; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; background: #070908; border-top: 1px solid var(--line); }
  #foot .by { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
  #foot .logo { background: #fff; border-radius: 8px; padding: 4px 8px; display: flex; align-items: center; height: 40px; }
  #foot .logo img { height: 32px; width: auto; display: block; }
  #foot .credit { margin-left: auto; font-size: 11px; color: #7d8782; text-align: right; line-height: 1.4; }
  #foot .credit a { color: #9aa49f; }
  #gmark { position: absolute; left: 12px; bottom: calc(var(--foot) + 8px); z-index: 2; font: 600 15px/1 Arial, sans-serif; color: #fff;
    text-shadow: 0 0 3px #000; letter-spacing: -0.02em; pointer-events: none; }

  /* ---------- overlays */
  #about { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.6); display: grid; place-items: center; padding: 16px; }
  #about .box { background: #111413; border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; max-width: 640px;
    max-height: 86vh; overflow-y: auto; font-size: 14px; line-height: 1.6; }
  #about h2 { margin: 0 0 8px; font-size: 20px; }
  #about h3 { margin: 16px 0 4px; font-size: 14px; color: var(--accent); }
  #about a { color: var(--accent); }
  #loading { position: absolute; inset: 0 0 var(--foot) 0; display: grid; place-items: center; font-size: 15px;
    color: var(--dim); background: rgba(11,13,12,0.55); z-index: 7; pointer-events: none; }
  #toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 30; background: #1b2420; border: 1px solid var(--accent2);
    color: var(--ink); font-size: 13px; padding: 8px 14px; border-radius: 99px; transition: opacity .3s; pointer-events: none; }
  .hidden { display: none !important; }

  @media (max-width: 760px) {
    :root { --foot: 50px; }
    #head { left: 12px; top: 12px; }
    #legend { top: auto; right: 10px; bottom: calc(var(--foot) + 158px); font-size: 12px; padding: 7px 9px; min-width: 0; }
    #legend .title { display: none; }
    #ctl { left: 10px; right: 10px; bottom: calc(var(--foot) + 8px); }
    .speeds button { padding: 5px 6px; }
    #note { display: none; }
    #card { bottom: calc(var(--foot) + 160px); right: 10px; }
    #panel { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(var(--foot) + 8px); max-height: 66vh; }
    #foot { gap: 8px; padding: 0 10px; }
    #foot .by { display: none; }
    #foot .logo { height: 34px; padding: 3px 6px; }
    #foot .logo img { height: 26px; }
    #foot .credit { font-size: 9.5px; max-width: 42%; }
    button .k { display: none; }
    .row-btns button { padding: 6px 9px; }
  }
  body.embed #note { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="fx"></canvas>

<div id="head">
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
  <div id="clock" class="hidden"></div>
  <div id="count"></div>
  <div id="search"><input id="q" type="search" autocomplete="off"><div id="hits" class="hidden"></div></div>
  <div class="row-btns">
    <button id="back" class="hidden"></button>
    <button id="btnFilters" class="hidden"></button>
    <button id="btnMap"></button>
    <button id="lang" aria-label="Language">اردو</button>
    <button id="btnShare"></button>
    <button id="aboutBtn"></button>
  </div>
</div>

<div id="legend" class="hidden"></div>
<div id="panel" class="hidden"></div>
<div id="card" class="hidden"></div>
<div id="gmark" class="hidden">Google</div>

<div id="ctl">
  <div class="bar hidden" id="player">
    <div class="top">
      <button id="play" aria-label="Play or pause">❚❚</button>
      <input id="slider" type="range" min="0" max="1" step="1" aria-label="Time of day">
      <div class="speeds" id="speeds"></div>
    </div>
    <canvas id="chart" aria-label="Vehicles running through the day"></canvas>
  </div>
  <div id="note"></div>
</div>

<h2>About Pakistan Transit Pulse</h2>
<p>An animated map of public transport across a full day in Pakistan's biggest cities. Each glowing dot is one bus, BRT bus or train, moving along its real road route.</p>
<h3>Where the routes come from</h3>
<p>Routes, stops, road-following route lines, frequencies and operating hours come from <a href="https://github.com/ShahzebSpeaks/pakistan-bus-routes" target="_blank" rel="noopener">Pakistan Bus Routes</a>, an open, source-cited dataset of Pakistan's city transit, routed along OpenStreetMap roads. Only routes marked operational or unverified are shown, and only those with a road-routed line, so every bus runs on a real road. Elevated metro lines are drawn station to station.</p>
<h3>Why the movement is modelled</h3>
<p>Pakistani city operators publish how often buses run and their service hours, not stop-by-stop timetables, and there is no official GTFS feed. So each day is built like this:</p>
<ul>
<li>Departures from both ends every headway, from first to last bus. Frequencies are thinner early, mid-day and late evening, and tightest in the 07:00–10:00 and 16:30–19:30 peaks.</li>
<li>Run times come from route distance at a typical speed for each mode: metro 34 km/h, BRT 22, electric/feeder buses 16, city buses 15, wagons 14. Road traffic is 20–25% slower in peak hours. Each stop adds a short dwell.</li>
<li>Routes with a <b>published frequency</b> use it. The rest use an <b>assumed frequency</b> for their mode. Use the Filters panel to show only one or the other.</li>
</ul>
<p>Vehicles speed up after each stop and slow down into the next, keep to the left of the road as in Pakistan, and turn with the road. Zoomed in, each mode is drawn at its real size: 18 m articulated BRT buses, 98 m five-car Orange Line trains, 12 m city, feeder, electric and pink buses, and 5.4 m Hiace-type wagons. After dark they run with headlights on.</p>
<p>Treat it as a picture of how the network breathes through the day, not as live positions or an exact timetable.</p>

function decode(d) {
  shapes = []; maxDur = 0;
  const [ox, oy] = d.origin;
  for (const flat of d.shapes) {
    const n = flat.length / 2, x = new Float64Array(n), y = new Float64Array(n), cum = new Float64Array(n);
    let ax = ox, ay = oy;
    for (let i = 0; i < n; i++) {
      ax += flat[2 * i]; ay += flat[2 * i + 1]; x[i] = ax; y[i] = ay;
      if (i) cum[i] = cum[i - 1] + Math.hypot(x[i] - x[i - 1], y[i] - y[i - 1]);
    }
    shapes.push({ x, y, cum });
  }
  pats = d.patterns.map(([s, c, e, ds]) => ({ s, c, e, ds: Float64Array.from(ds) }));
  for (const p of pats) { // stop distances were measured on the full-precision line; rescale onto the rounded one
    const L = shapes[p.s].cum[shapes[p.s].cum.length - 1], last = p.ds[p.ds.length - 1] || 1;
    const f = L / last; for (let i = 0; i < p.ds.length; i++) p.ds[i] *= f;
  }
  patRoute = Int32Array.from(pats.map((p) => d.shape_style[p.s][2]));
  patMode = pats.map((p, i) => d.routes[patRoute[i]].mode);
  profs = d.profiles.map((p) => Int32Array.from(p));
  trips = Int32Array.from(d.trips);
  const n = trips.length / 4;
  tripEnd = new Int32Array(n); tripStarts = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    const p = profs[trips[4 * i + 2]];
    tripStarts[i] = trips[4 * i];
    tripEnd[i] = trips[4 * i] + p[p.length - 1];
    maxDur = Math.max(maxDur, p[p.length - 1]);
  }
  d.mscale = 1 / Math.cos(d.center[1] * Math.PI / 180);
  const modeCol = {}; for (const [m, , , cols] of d.legend) modeCol[m] = cols[0];
  d.stXY = (d.stations || []).map(([name, ur, ix, iy, m]) => ({ name, ur, x: d.origin[0] + ix, y: d.origin[1] + iy, col: modeCol[m] || "#22D07A" }));
  routeVis = new Uint8Array(d.routes.length).fill(1);
  patVis = new Uint8Array(pats.length).fill(1);
}

function bisect(a, v) { // last index i with a[i] <= v (0 if none)
  let lo = 0, hi = a.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (a[m] <= v) lo = m; else hi = m - 1; }
  return lo;
}

// ---------- motion: time -> distance (with acceleration) -> position + heading on the road line
const EASE_A = 0.2; // share of each stop-to-stop run spent speeding up, and again slowing down
function ease(u) {
  const a = EASE_A, v = 1 / (1 - a);
  if (u < a) return v * u * u / (2 * a);
  if (u > 1 - a) return 1 - v * (1 - u) * (1 - u) / (2 * a);
  return v * (u - a / 2);
}
function distAt(pat, prof, rel) {
  const i = bisect(prof, rel);
  if (i >= prof.length - 1) return pat.ds[pat.ds.length - 1];
  const span = prof[i + 1] - prof[i], dd = pat.ds[i + 1] - pat.ds[i];
  return span > 0 && dd > 0 ? pat.ds[i] + dd * ease((rel - prof[i]) / span) : pat.ds[i];
}
function ptAt(sh, d, out, o) {
  const c = sh.cum, last = c.length - 1;
  let j, f;
  if (d <= 0) { j = 0; f = 0; } else if (d >= c[last]) { j = last - 1; f = 1; }
  else { j = Math.min(bisect(c, d), last - 1); f = (d - c[j]) / ((c[j + 1] - c[j]) || 1); }
  out[o] = sh.x[j] + (sh.x[j + 1] - sh.x[j]) * f;
  out[o + 1] = sh.y[j] + (sh.y[j + 1] - sh.y[j]) * f;
}
const HB = [0, 0, 0, 0];
// out: [x, y, heading]; heading is the chord across +-hl metres, so vehicles turn smoothly at corners
function pos(pat, prof, rel, out, hl) {
  if (rel < 0 || rel > prof[prof.length - 1]) return false;
  const sh = shapes[pat.s], d = distAt(pat, prof, rel), h = hl || 6;
  ptAt(sh, d, out, 0);
  ptAt(sh, d - h, HB, 0); ptAt(sh, d + h, HB, 2);
  out[2] = Math.atan2(HB[3] - HB[1], HB[2] - HB[0]);
  return true;
}
const toLL = (x, y) => [x / R * 360 / TAU, (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI];

function applyFilters(redraw = true) {

      && (F.only.size === 0 || F.only.has(i)) ? 1 : 0;
  });
  for (let p = 0; p < pats.length; p++) patVis[p] = routeVis[patRoute[p]];

  $("btnFilters").innerHTML = `<span class="t">${t().filters}</span>${filtersActive() ? '<span class="dot"></span>' : ""}<span class="k">F</span>`;
}

function clearBasemap() {

function probe(url) { // can a tile actually load here? (blocked in some previews)
  return new Promise((res) => {
    const img = new Image(); const to = setTimeout(() => res(false), 6000);
    img.onload = () => { clearTimeout(to); res(true); }; img.onerror = () => { clearTimeout(to); res(false); };
    img.src = url.replace("{z}", "6").replace("{x}", "45").replace("{y}", "26").replace("{s}", "a");
  });
}
async function setBasemap(key, userAction) {
  bmKey = key; store.set("basemap2", key); bmState = "";
  const b = BASEMAPS[key];
  if (key === "none" || key === "streets") { noBasemap(); roadsVisible(key === "streets"); renderPanel(); return; }
  roadsVisible(false);
  if (b.google) return setGoogle(store.get("gkey", ""), userAction);
  bmState = "loading"; renderPanel();
  if (!(await probe(b.tiles[0]))) { bmState = "blocked"; if (bmKey === key) { noBasemap(); roadsVisible(true); } renderPanel(); return; }
  if (bmKey !== key) return;
  addRaster(b.tiles, b.size || 256, b.bright, b.credit, b.light);
  bmState = "ok"; renderPanel();
}
let gSession = null, gErr = "";
async function setGoogle(apiKey, userAction) {
  if (!apiKey) { bmState = "needkey"; noBasemap(); roadsVisible(true); renderPanel(); return; }
  roadsVisible(false);
  bmState = "loading"; renderPanel();
  let r;
  try {
    r = await fetch(`https://tile.googleapis.com/v1/createSession?key=${encodeURIComponent(apiKey)}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mapType: "roadmap", language: LANG === "ur" ? "ur" : "en-US", region: "PK", scale: "scaleFactor2x", highDpi: true, styles: GOOGLE_DARK }),
    });
  } catch (e) { bmState = "blocked"; noBasemap(); roadsVisible(true); renderPanel(); return; }  // never reached Google
  try {
    if (!r.ok) { let m = ""; try { m = (await r.json()).error.message; } catch (e2) {} throw new Error(m || "HTTP " + r.status); }
    gSession = (await r.json()).session;
    if (bmKey !== "google") return;
    addRaster([`https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session=${gSession}&key=${encodeURIComponent(apiKey)}`], 256, 1, "Map data © Google", false);
    $("gmark").classList.remove("hidden");
    bmState = "ok";
  } catch (e) { bmState = "gfail"; gErr = e.message; noBasemap(); roadsVisible(true); }
  renderPanel();
}
function roadsVisible(v) { if (map.getLayer("roads")) map.setLayoutProperty("roads", "visibility", v ? "visible" : "none"); }
let roadsCache = {};
async function loadRoads(key) {
  try {
    const r = roadsCache[key] || (roadsCache[key] = await fetch(`data/${key}-roads.json`).then((x) => x.json()));
    if (cityKey !== key) return;
    // one MultiLineString per road class keeps the map light even for Karachi's full street grid
    const byClass = {};
    let ax = r.origin[0], ay = r.origin[1], px = 0, py = 0;
    for (const row of r.lines) {
      const coords = [];
      for (let i = 1; i < row.length; i += 2) { px += row[i]; py += row[i + 1]; coords.push(toLL(ax + px, ay + py)); }
      (byClass[row[0]] = byClass[row[0]] || []).push(coords);
    }
    const feats = Object.keys(byClass).sort((a, b) => b - a).map((c) => ({ type: "Feature", properties: { c: +c },
      geometry: { type: "MultiLineString", coordinates: byClass[c] } }));
    map.getSource("roads").setData({ type: "FeatureCollection", features: feats });
  } catch (e) { /* no street background for this city */ }
}
function setCredit() {
  const short = innerWidth < 760;
  const streets = (bmKey === "streets" || !bmCredit) && D ? (short ? " · Streets © OSM" : " · Streets © OpenStreetMap contributors") : "";
  const base = short ? '© <a href="https://github.com/ShahzebSpeaks/pakistan-bus-routes" target="_blank" rel="noopener">Pakistan Bus Routes</a>, OSM (ODbL)' : ROUTE_CREDIT;
  const bm = short ? bmCredit.replace(", © OpenStreetMap contributors", "") : bmCredit;
  $("credit").innerHTML = base + (bm ? ` · ${bm}` : "") + streets;
}

function setNetwork() {
  const feats = [];
  if (D && V.lines) {
    const seen = new Set();
    D.shape_style.forEach(([c, e, r], i) => {
      if (seen.has(r)) return; // one line per route, not per direction
      seen.add(r);
      const sh = shapes[i], coords = [];
      for (let k = 0; k < sh.x.length; k++) coords.push(toLL(sh.x[k], sh.y[k]));
      feats.push({ type: "Feature", properties: { col: D.colours[c], e, a: D.network_alpha, r, off: !routeVis[r] },
        geometry: { type: "LineString", coordinates: coords } });
    });
    feats.sort((a, b) => (a.properties.off ? -1 : a.properties.e) - (b.properties.off ? -1 : b.properties.e));
  }
  map.getSource("net").setData({ type: "FeatureCollection", features: feats });
}

function buildSprites() { // glowing dots, per colour x emphasis
  spriteR = dotRadius(); spriteKey = V.glow + "|" + V.size;

    cv.width = cv.height = s;

function shade(hex, f) {
  const n = parseInt(hex.slice(1, 7), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f > 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

function busSection(c, x, y, L, W, col, front, rear, ebus) {

        <i style="background:${cols[0]};color:${cols[0]}"></i><span class="t">${LANG === "ur" ? ur : en}</span> <span class="k">${modeCount[m]}</span></button>`).join("")}</div>
      <h4><span class="t">${L.confidence}</span></h4>
      <div class="seg">${["all", "published", "assumed"].map((c) => `<button data-conf="${c}" class="t ${F.conf === c ? "on" : ""}">${L[c]}</button>`).join("")}</div>
      <h4><span class="t">${L.services}</span></h4>
      <div class="list">${systems.map((s) => `<label><input type="checkbox" data-sys="${esc(s)}" ${F.sysOff.has(s) ? "" : "checked"}>
        <span class="nm" style="color:var(--ink)">${esc(s)}</span><span class="n">${sysCount[s]}</span></label>`).join("")}</div>
      <h4><span class="t">${L.routes}</span>${F.only.size ? `<button class="linkish t" data-clearonly>${L.clear}</button>` : ""}</h4>
      <input type="search" id="rq" placeholder="${L.findRoute}" value="${esc(routeQuery)}">
      ${F.only.size ? `<div class="muted t" style="margin:6px 0">${L.onlySel(F.only.size)}</div>` : ""}
      <div class="list" style="margin-top:6px">${shown.length ? shown.map(([r, i]) => {
        const col = D.legend.find((l) => l[0] === r.mode)[3][0];
        return `<label><input type="checkbox" data-route="${i}" ${F.only.has(i) ? "checked" : ""}>
        <span class="rid" style="color:${col}">${esc(r.id)}</span><span class="nm">${esc(LANG === "ur" && r.name_ur ? r.name_ur : r.name)}</span>
        <button class="linkish" data-focus="${i}" title="Zoom to route">⌖</button></label>`; }).join("") : `<div class="muted t" style="padding:8px">${L.noRoutes}</div>`}</div>
      <p><button data-reset class="t" ${filtersActive() ? "" : "disabled"}>${L.reset}</button></p>`;
  } else if (panelTab === "map") {
    const msg = { blocked: L.bmBlocked, needkey: L.gNeedKey, gfail: L.gFail + (gErr ? ` (Google: ${esc(gErr)})` : ""), loading: "…" }[bmState] || "";
    body = `<h4><span class="t">${L.basemap}</span></h4>
      <div class="bm">${Object.entries(BASEMAPS).map(([k, b]) => `<button data-bm="${k}" class="${bmKey === k ? "on" : ""}">
        <span class="sw" style="background:${b.sw}"></span><span class="t">${LANG === "ur" ? b.ur : b.en}</span><small>${b.note}</small></button>`).join("")}</div>
      ${bmKey === "google" ? `<h4><span class="t">${L.gkey}</span></h4>
        <div class="row"><input type="password" id="gk" placeholder="AIza…" value="${esc(store.get("gkey", ""))}"><button id="gkSave" class="t">${L.save}</button></div>` : ""}
      <div id="bmMsg" class="muted t ${["blocked", "gfail"].includes(bmState) ? "err" : ""}">${msg}</div>`;
  } else if (panelTab === "display" && D) {
    body = `<h4><span class="t">${L.display}</span></h4>
      <label class="switch"><span class="t">${L.lines}</span><input type="checkbox" data-v="lines" ${V.lines ? "checked" : ""}></label>
      <label class="switch"><span class="t">${L.trails}</span><input type="checkbox" data-v="trails" ${V.trails ? "checked" : ""}></label>
      <label class="switch"><span class="t">${L.glow}</span><input type="checkbox" data-v="glow" ${V.glow ? "checked" : ""}></label>
      <label class="switch"><span class="t">${L.stationsL}</span><input type="checkbox" data-v="stations" ${V.stations ? "checked" : ""}></label>
      <label class="switch"><span class="t">${L.lightsL}</span><input type="checkbox" data-v="lights" ${V.lights ? "checked" : ""}></label>
      <h4><span class="t">${L.vstyle}</span></h4>
      <div class="seg">${[["auto", L.vAuto], ["dots", L.vDots], ["vehicles", L.vReal]].map(([v, l]) => `<button data-style="${v}" class="t ${V.style === v ? "on" : ""}">${l}</button>`).join("")}</div>
      <div class="muted t" style="margin-top:6px">${L.vHint}</div>
      <h4><span class="t">${L.size}</span></h4>
      <div class="seg">${[[0.7, "S"], [1, "M"], [1.45, "L"], [2, "XL"]].map(([v, l]) => `<button data-size="${v}" class="${V.size === v ? "on" : ""}">${l}</button>`).join("")}</div>
      <h4><span class="t">${L.jump}</span></h4>
      <div class="chips">${[[8, "morning"], [13, "midday"], [18, "evening"], [22, "night"]].map(([h, k]) =>
        `<button class="chip" data-jump="${h}"><span class="t">${L[k]}</span> <span class="k">${String(h).padStart(2, "0")}:00</span></button>`).join("")}</div>`;
  }
  el.innerHTML = `<div class="tabs">${tabs}<button class="x" aria-label="Close">✕</button></div><div class="body">${body}</div>`;
  el.querySelector(".x").onclick = () => openPanel(panelTab);
  el.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => {
    panelTab = b.dataset.tab;
    $("btnFilters").classList.toggle("on", panelTab === "filters");
    $("btnMap").classList.toggle("on", panelTab === "map" || panelTab === "display");
    renderPanel();
  });
  el.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { const m = b.dataset.mode; F.modeOff.has(m) ? F.modeOff.delete(m) : F.modeOff.add(m); applyFilters(); });
  el.querySelectorAll("[data-conf]").forEach((b) => b.onclick = () => { F.conf = b.dataset.conf; applyFilters(); });
  el.querySelectorAll("[data-sys]").forEach((c) => c.onchange = () => { const s = c.dataset.sys; c.checked ? F.sysOff.delete(s) : F.sysOff.add(s); applyFilters(); });
  el.querySelectorAll("[data-route]").forEach((c) => c.onchange = () => { const i = +c.dataset.route; c.checked ? F.only.add(i) : F.only.delete(i); applyFilters(); });
  el.querySelectorAll("[data-focus]").forEach((b) => b.onclick = (e) => { e.preventDefault(); focusRoute(+b.dataset.focus); });
  const cl = el.querySelector("[data-clearonly]"); if (cl) cl.onclick = () => { F.only.clear(); applyFilters(); };
  const rs = el.querySelector("[data-reset]"); if (rs) rs.onclick = resetFilters;
  const rq = el.querySelector("#rq");
  if (rq) rq.oninput = () => { routeQuery = rq.value; const p = rq.selectionStart; renderPanel(); const n = $("rq"); n.focus(); n.setSelectionRange(p, p); };
  el.querySelectorAll("[data-bm]").forEach((b) => b.onclick = () => setBasemap(b.dataset.bm, true));
  const gs = el.querySelector("#gkSave"); if (gs) gs.onclick = () => { const k = $("gk").value.trim(); store.set("gkey", k); setGoogle(k, true); };
  el.querySelectorAll("[data-v]").forEach((c) => c.onchange = () => { V[c.dataset.v] = c.checked; if (c.dataset.v === "lines") setNetwork(); });
  el.querySelectorAll("[data-style]").forEach((b) => b.onclick = () => { V.style = b.dataset.style; renderPanel(); });
  el.querySelectorAll("[data-size]").forEach((b) => b.onclick = () => { V.size = +b.dataset.size; renderPanel(); });
  el.querySelectorAll("[data-jump]").forEach((b) => b.onclick = () => jumpTo(+b.dataset.jump));
}
function routeBounds(ri) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  D.shape_style.forEach(([, , r], i) => { if (r !== ri) return; const s = shapes[i];
    for (let k = 0; k < s.x.length; k++) { x0 = Math.min(x0, s.x[k]); x1 = Math.max(x1, s.x[k]); y0 = Math.min(y0, s.y[k]); y1 = Math.max(y1, s.y[k]); } });
  return [toLL(x0, y0), toLL(x1, y1)];
}
function focusRoute(ri) {
  map.setFilter("hl", ["==", ["get", "r"], ri]);
  map.fitBounds(routeBounds(ri), { padding: { top: 120, bottom: 200, left: 40, right: innerWidth > 760 ? 380 : 40 }, duration: 900, maxZoom: 15 });
}

// ================================================================== tap a vehicle
let selTrip = -1, followTrip = -1;
function showCard(ti) {
  selTrip = ti;
  const ri = patRoute[trips[4 * ti + 1]], r = D.routes[ri], L = t();
  const lg = D.legend.find((l) => l[0] === r.mode);
  map.setFilter("hl", ["==", ["get", "r"], ri]);
  $("card").innerHTML = `<button class="x" aria-label="Close">✕</button>
    <div class="rid" style="color:${lg[3][0]}">${esc(r.id)}</div>
    <div class="nm">${esc(r.name)}</div>${r.name_ur ? `<div class="ur-nm">${esc(r.name_ur)}</div>` : ""}
    <dl><dt class="t">${L.system}</dt><dd>${esc(LANG === "ur" && r.system_ur ? r.system_ur : r.system)}</dd>
    <dt class="t">${L.headway}</dt><dd>${r.headway} ${L.min} <span class="badge t ${r.conf === "published" ? "pub" : "ass"}">${r.conf === "published" ? L.pub : L.ass}</span></dd>
    <dt class="t">${L.hours}</dt><dd>${fmt(r.hours[0])}–${fmt(r.hours[1])}</dd>
    ${r.fare ? `<dt class="t">${L.fare}</dt><dd>${esc(r.fare)}</dd>` : ""}
    <dt class="t">${L.length}</dt><dd>${r.km} km</dd></dl>
    <div class="acts"><button id="cFollow" class="t ${followTrip === ti ? "on" : ""}">${followTrip === ti ? L.following : L.follow}</button>
    <button id="cOnly" class="t">${L.only}</button></div>`;
  $("card").classList.remove("hidden");
  $("card").querySelector(".x").onclick = hideCard;
  $("cFollow").onclick = () => { followTrip = followTrip === ti ? -1 : ti; if (followTrip >= 0 && map.getZoom() < 13.5) map.jumpTo({ zoom: 14.5 }); showCard(ti); };
  $("cOnly").onclick = () => { F.only = new Set([ri]); applyFilters(); focusRoute(ri); };
}
function hideCard() { selTrip = -1; followTrip = -1; $("card").classList.add("hidden"); map.setFilter("hl", ["==", ["get", "r"], -1]); }
function followStep() {
  const i = followTrip, st = tripStarts[i];
  if (simT < st || simT > tripEnd[i]) { followTrip = -1; if (selTrip >= 0) showCard(selTrip); return; }
  if (pos(pats[trips[4 * i + 1]], profs[trips[4 * i + 2]], simT - st, tmp)) map.jumpTo({ center: toLL(tmp[0], tmp[1]) });
}
map.on("click", (e) => {
  if (!D) return;
  const px = e.point.x * dpr, py = e.point.y * dpr;
  let best = -1, bd = Math.max(18 * dpr, 6 * dpr * map.getZoom() / 2) ** 2;
  for (let h = 0; h < heads.length; h += HS) {
    const d = (heads[h] - px) ** 2 + (heads[h + 1] - py) ** 2;
    if (d < bd) { bd = d; best = heads[h + 4]; }
  }
  best >= 0 ? showCard(best) : hideCard();
});
map.on("dragstart", () => { if (followTrip >= 0) { followTrip = -1; if (selTrip >= 0) showCard(selTrip); } });

// ================================================================== misc controls
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.remove("hidden"); el.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.classList.add("hidden"), 300); }, 2200);
}
async function share() {
  const url = location.href;
  try { await navigator.clipboard.writeText(url); toast(t().copied); } catch (e) { toast(t().copyFail + url); }
}
function initControls() {
  slider.addEventListener("input", () => { simT = +slider.value; });
  slider.addEventListener("pointerdown", () => setPlaying(false));
  $("play").onclick = () => setPlaying(!playing);
  const box = $("speeds");
  for (const [v, label] of SPEEDS) {
    const b = document.createElement("button"); b.textContent = label; b.className = v === speed ? "on" : "";
    b.onclick = () => { speed = v; [...box.children].forEach((x) => x.classList.toggle("on", x === b)); };
    box.appendChild(b);
  }
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space" && D) { e.preventDefault(); setPlaying(!playing); }
    if (e.key === "f" && D) openPanel("filters");
    if (e.key === "m") openPanel("map");
    if (e.key === "Escape") { hideCard(); $("about").classList.add("hidden"); if (panelTab) openPanel(panelTab); }
  });
  $("back").onclick = () => { location.hash = ""; closeCity(); };
  $("btnFilters").onclick = () => openPanel("filters");
  $("btnMap").onclick = () => openPanel(D ? (panelTab === "display" ? "display" : "map") : "map");
  $("btnShare").onclick = share;
  $("lang").onclick = () => { LANG = LANG === "en" ? "ur" : "en"; store.set("lang", LANG); applyLang(); };
  $("aboutBtn").onclick = openAbout;
  document.addEventListener("click", (e) => { if (e.target.closest("[data-about]")) openAbout(); });
  $("about").onclick = (e) => { if (e.target.id === "about") $("about").classList.add("hidden"); };
}
function openAbout() {
  $("aboutBox").innerHTML = ABOUT;
  $("about").classList.remove("hidden");
  $("aboutClose").onclick = () => $("about").classList.add("hidden");
}

function applyLang() {
  const L = t();
  document.body.classList.toggle("ur", LANG === "ur");
  document.documentElement.lang = LANG;
  $("lang").textContent = L.lang;
  $("aboutBtn").innerHTML = `<span class="t">${L.about}</span>`;
  $("btnShare").innerHTML = `<span class="t">${L.share}</span>`;
  $("btnMap").innerHTML = `<span class="t">${L.map}</span><span class="k">M</span>`;
  $("back").innerHTML = `<span class="t">${L.back}</span>`;
  $("byLbl").textContent = L.by;
  $("q").placeholder = L.search; $("loading").textContent = L.loading;
  $("note").innerHTML = L.note;
  setCredit();
  if (D) {
    $("title").textContent = LANG === "ur" ? D.city_ur || D.city : D.city;
    $("subtitle").textContent = L.subCity(D.province);
    applyFilters(false); setLegend(); if (selTrip >= 0) showCard(selTrip);
  } else {
    $("title").innerHTML = L.title; $("subtitle").textContent = L.sub;
    $("count").textContent = CITIES.length ? L.cities(CITIES.length) : "";
  }
  renderPanel();
  labelMarkers();
}

// ================================================================== search
function initSearch() {
  const q = $("q"), hits = $("hits");
  let list = [], sel = 0;
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const render = () => {
    const v = norm(q.value.trim());
    list = v ? CITIES.filter((c) => norm(c.name).includes(v) || (c.name_ur || "").includes(q.value.trim())) : [...CITIES];
    sel = 0;
    hits.innerHTML = list.length ? list.map((c, i) =>
      `<div data-k="${c.key}" class="${i === sel ? "sel" : ""}">${esc(LANG === "ur" ? c.name_ur : c.name)}<span>${c.trips.toLocaleString("en")} ${t().trips}</span></div>`).join("")
      : `<div>${t().none}</div>`;
    hits.classList.remove("hidden");
  };
  const pick = (key) => { hits.classList.add("hidden"); q.value = ""; q.blur(); if (key) openCity(key); };
  q.addEventListener("focus", render);
  q.addEventListener("input", render);
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + list.length) % list.length;
      [...hits.children].forEach((d, i) => d.classList.toggle("sel", i === sel));
    } else if (e.key === "Enter") pick(list[sel] && list[sel].key);
    else if (e.key === "Escape") pick(null);
  });
  hits.addEventListener("mousedown", (e) => { const d = e.target.closest("[data-k]"); if (d) pick(d.dataset.k); });
  q.addEventListener("blur", () => setTimeout(() => hits.classList.add("hidden"), 150));
}

// ================================================================== city <-> landing
function netBounds() { // frame the busiest 96% of the network so one long outlying route doesn't zoom out
  const xs = [], ys = [];
  for (const s of shapes) for (let i = 0; i < s.x.length; i++) { xs.push(s.x[i]); ys.push(s.y[i]); }
  xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
  const q = (a, f) => a[Math.min(a.length - 1, Math.floor(f * a.length))];
  return [toLL(q(xs, 0.02), q(ys, 0.02)), toLL(q(xs, 0.98), q(ys, 0.98))];
}

async function openCity(key) {
  const meta = CITIES.find((c) => c.key === key);
  if (!meta) return;
  const seq = ++loadSeq;
  hideCard();
  map.flyTo({ center: meta.center, zoom: 10.5, duration: 1400 });
  $("loading").classList.toggle("hidden", !!cache[key]);
  let d;
  try { d = cache[key] || (cache[key] = await fetch(`data/${key}.json`).then((r) => r.json())); }
  catch (e) { $("loading").textContent = "Could not load this city."; return; }
  if (seq !== loadSeq) return;
  D = d; cityKey = key; chartBase = null; routeQuery = "";
  F.modeOff.clear(); F.sysOff.clear(); F.conf = "all"; F.only.clear();
  decode(d); applyFilters(false);
  map.getSource("roads").setData({ type: "FeatureCollection", features: [] });
  loadRoads(key);
  setNetwork(); buildSprites(); setLegend();
  map.fitBounds(netBounds(), { padding: { top: 150, bottom: 170, left: 30, right: innerWidth > 760 ? 240 : 30 }, duration: 1200, maxZoom: 13 });
  for (const [k, m] of Object.entries(markers)) m.el.classList.toggle("hidden", k === key);
  slider.min = d.t0; slider.max = d.t1;
  simT = Math.min(Math.max(simT, d.t0), d.t1);
  for (const id of ["clock", "back", "player", "btnFilters"]) $(id).classList.remove("hidden");
  $("legend").classList.toggle("hidden", !!panelTab);
  $("search").classList.add("hidden");
  $("loading").classList.add("hidden");
  applyLang();
  requestAnimationFrame(drawChart);
  if (location.hash.slice(1) !== key) history.replaceState(null, "", "#" + key);
  if (!openCity.hinted) { openCity.hinted = true; setTimeout(() => toast(t().zoomHint), 1600); }
}

function closeCity() {
  loadSeq++; hideCard();
  D = null; cityKey = null;
  setNetwork();
  map.getSource("roads").setData({ type: "FeatureCollection", features: [] });
  if (panelTab && panelTab !== "map") openPanel(panelTab);
  for (const m of Object.values(markers)) m.el.classList.remove("hidden");
  for (const id of ["clock", "back", "legend", "player", "btnFilters"]) $(id).classList.add("hidden");
  $("search").classList.remove("hidden");
  applyLang();
  map.flyTo({ ...WORLD(), duration: 1400 });
}

// ================================================================== boot
addEventListener("resize", () => { resize(); setCredit(); });
map.on("load", async () => {
  resize();
  setCredit();
  const [cities, pk] = await Promise.all([fetch("data/cities.json").then((r) => r.json()),
    fetch("data/pakistan.json").then((r) => r.json()).catch(() => null)]);
  CITIES = cities;
  if (pk) map.getSource("pk").setData(pk);
  addMarkers(); initControls(); initSearch(); applyLang();
  setBasemap(bmKey, false);
  const fromHash = () => { const k = location.hash.slice(1); if (k && k !== cityKey) openCity(k); else if (!k && cityKey) closeCity(); };
  addEventListener("hashchange", fromHash); fromHash();
  requestAnimationFrame(tick);
});
</script>
